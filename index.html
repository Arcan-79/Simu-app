<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111" />
  <title>Simu App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; touch-action: none; }
    #ui {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; gap: 8px; padding: 10px;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
    }
    #ui button {
      flex: 1; padding: 14px; font-size: 14px;
      background: #222; color: #fff; border: 1px solid #444;
      border-radius: 12px;
    }
    #ui button:active { background: #0a7; }
  </style>
</head>
<body>
  <div id="ui">
    <button id="btnCubo">➕ Cubo</button>
    <button id="btnEsfera">⚪ Esfera</button>
    <button id="btnBorrar">🗑️ Borrar</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a18);
    scene.fog = new THREE.Fog(0x0a0a18, 10, 50);

    const camera = new THREE.PerspectiveCamera(
      60, innerWidth / innerHeight, 0.1, 1000
    );
    camera.position.set(0, 5, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const sol = new THREE.DirectionalLight(0xffffff, 1.2);
    sol.position.set(5, 10, 5);
    scene.add(sol);

    const piso = new THREE.Mesh(
      new THREE.PlaneGeometry(50, 50),
      new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9 })
    );
    piso.rotation.x = -Math.PI / 2;
    scene.add(piso);

    const grid = new THREE.GridHelper(50, 50, 0x00ffaa, 0x224466);
    grid.position.y = 0.01;
    scene.add(grid);

    const objetos = [];

    function crearCubo() {
      const geo = new THREE.BoxGeometry(1, 1, 1);
      const mat = new THREE.MeshStandardMaterial({
        color: Math.random() * 0xffffff,
        roughness: 0.4, metalness: 0.2
      });
      const m = new THREE.Mesh(geo, mat);
      m.position.set(
        (Math.random() - 0.5) * 6,
        0.5,
        (Math.random() - 0.5) * 6
      );
      scene.add(m);
      objetos.push(m);
    }

    function crearEsfera() {
      const geo = new THREE.SphereGeometry(0.6, 32, 32);
      const mat = new THREE.MeshStandardMaterial({
        color: Math.random() * 0xffffff,
        roughness: 0.3, metalness: 0.4
      });
      const m = new THREE.Mesh(geo, mat);
      m.position.set(
        (Math.random() - 0.5) * 6,
        0.6,
        (Math.random() - 0.5) * 6
      );
      scene.add(m);
      objetos.push(m);
    }

    function borrarUltimo() {
      const m = objetos.pop();
      if (m) scene.remove(m);
    }

    document.getElementById('btnCubo').onclick = crearCubo;
    document.getElementById('btnEsfera').onclick = crearEsfera;
    document.getElementById('btnBorrar').onclick = borrarUltimo;

    let rotando = false, ultimoX = 0, ultimoY = 0;
    let anguloH = 0, anguloV = 0.4, distancia = 12;

    const canvas = renderer.domElement;

    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        rotando = true;
        ultimoX = e.touches[0].clientX;
        ultimoY = e.touches[0].clientY;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      if (!rotando || e.touches.length !== 1) return;
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - ultimoX;
      const dy = t.clientY - ultimoY;
      ultimoX = t.clientX;
      ultimoY = t.clientY;

      anguloH -= dx * 0.01;
      anguloV -= dy * 0.01;
      anguloV = Math.max(0.1, Math.min(1.4, anguloV));

      const x = distancia * Math.cos(anguloV) * Math.sin(anguloH);
      const z = distancia * Math.cos(anguloV) * Math.cos(anguloH);
      const y = distancia * Math.sin(anguloV);
      camera.position.set(x, y, z);
      camera.lookAt(0, 0, 0);
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      rotando = false;
    });

    function animar() {
      requestAnimationFrame(animar);
      renderer.render(scene, camera);
    }
    animar();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
