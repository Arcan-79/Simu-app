<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111" />
  <title>Simu App</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
    canvas { display: block; touch-action: none; }

    #ui {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; flex-wrap: wrap; gap: 6px; padding: 8px;
      background: rgba(0,0,0,0.8); backdrop-filter: blur(8px);
    }
    #ui button {
      flex: 1 1 30%; padding: 12px 6px; font-size: 13px;
      background: #222; color: #fff; border: 1px solid #444;
      border-radius: 12px; font-weight: 500;
    }
    #ui button:active { background: #0a7; }

    #panelIA {
      position: fixed; top: 0; left: 0; right: 0;
      background: rgba(10, 10, 30, 0.95); backdrop-filter: blur(10px);
      padding: 12px; display: none; flex-direction: column; gap: 8px;
      border-bottom: 2px solid #0fa; z-index: 20;
    }
    #panelIA.on { display: flex; }
    #panelIA h3 { color: #0fa; font-size: 14px; margin-bottom: 4px; }
    #panelIA input {
      padding: 12px; border-radius: 8px; border: 1px solid #444;
      background: #111; color: #fff; font-size: 14px; width: 100%;
    }
    #panelIA .row { display: flex; gap: 8px; }
    #panelIA .row button {
      flex: 1; padding: 12px; border-radius: 8px; border: none;
      background: #0fa; color: #000; font-weight: bold; font-size: 14px;
    }
    #panelIA .row button.cancelar { background: #444; color: #fff; }

    #estado {
      position: fixed; top: 8px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); color: #0fa; padding: 8px 16px;
      border-radius: 20px; font-size: 13px; display: none; z-index: 30;
    }
    #estado.on { display: block; }
  </style>
</head>
<body>
  <div id="estado"></div>

  <div id="panelIA">
    <h3>🤖 Crear personaje con IA</h3>
    <input id="promptIA" type="text" placeholder="Ej: samurái anime cabello azul" />
    <div class="row">
      <button id="btnGenerar">✨ Generar</button>
      <button id="btnCancelar" class="cancelar">Cancelar</button>
    </div>
  </div>

  <div id="ui">
    <button id="btnCubo">➕ Cubo</button>
    <button id="btnEsfera">⚪ Esfera</button>
    <button id="btnPersonaje">🎨 Personaje IA</button>
    <button id="btnBorrar">🗑️ Borrar</button>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';

    // ===== ESCENA =====
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a18);
    scene.fog = new THREE.Fog(0x0a0a18, 15, 60);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 5, 12);
    camera.lookAt(0, 1, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // ===== LUCES =====
    scene.add(new THREE.AmbientLight(0xffffff, 0.7));
    const sol = new THREE.DirectionalLight(0xffffff, 1.2);
    sol.position.set(5, 10, 5);
    scene.add(sol);

    // ===== PISO =====
    const piso = new THREE.Mesh(
      new THREE.PlaneGeometry(60, 60),
      new THREE.MeshStandardMaterial({ color: 0x1a1a2e, roughness: 0.9 })
    );
    piso.rotation.x = -Math.PI / 2;
    scene.add(piso);

    const grid = new THREE.GridHelper(60, 60, 0x00ffaa, 0x224466);
    grid.position.y = 0.01;
    scene.add(grid);

    // ===== OBJETOS =====
    const objetos = [];

    function crearCubo() {
      const m = new THREE.Mesh(
        new THREE.BoxGeometry(1, 1, 1),
        new THREE.MeshStandardMaterial({
          color: Math.random() * 0xffffff,
          roughness: 0.4, metalness: 0.2
        })
      );
      m.position.set((Math.random() - 0.5) * 6, 0.5, (Math.random() - 0.5) * 6);
      scene.add(m);
      objetos.push(m);
    }

    function crearEsfera() {
      const m = new THREE.Mesh(
        new THREE.SphereGeometry(0.6, 32, 32),
        new THREE.MeshStandardMaterial({
          color: Math.random() * 0xffffff,
          roughness: 0.3, metalness: 0.4
        })
      );
      m.position.set((Math.random() - 0.5) * 6, 0.6, (Math.random() - 0.5) * 6);
      scene.add(m);
      objetos.push(m);
    }

    function borrarUltimo() {
      const m = objetos.pop();
      if (m) {
        scene.remove(m);
        if (m.material && m.material.map) m.material.map.dispose();
        if (m.material) m.material.dispose();
        if (m.geometry) m.geometry.dispose();
      }
    }

    // ===== PANEL IA =====
    const estado = document.getElementById('estado');
    const panelIA = document.getElementById('panelIA');
    const promptInput = document.getElementById('promptIA');

    function mostrarEstado(msg) {
      estado.textContent = msg;
      estado.classList.add('on');
    }
    function ocultarEstado() {
      estado.classList.remove('on');
    }

    document.getElementById('btnPersonaje').onclick = () => {
      panelIA.classList.add('on');
      promptInput.focus();
    };

    document.getElementById('btnCancelar').onclick = () => {
      panelIA.classList.remove('on');
      promptInput.value = '';
    };

    document.getElementById('btnGenerar').onclick = async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        alert('Escribe una descripción, carnal.');
        return;
      }

      panelIA.classList.remove('on');
      mostrarEstado('🎨 Generando personaje... (30-60 seg)');

      const estilo = `${prompt}, full body character, anime style, centered, simple background, high quality, digital art`;
      const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(estilo)}?width=512&height=768&nologo=true&seed=${Math.floor(Math.random()*99999)}`;

      const img = new Image();
      img.crossOrigin = 'anonymous';

      img.onload = () => {
        const tex = new THREE.CanvasTexture(img);
        tex.colorSpace = THREE.SRGBColorSpace;

        const mat = new THREE.SpriteMaterial({
          map: tex,
          transparent: true,
          depthTest: true
        });
        const sprite = new THREE.Sprite(mat);
        sprite.scale.set(2, 3, 1);
        sprite.position.set((Math.random() - 0.5) * 5, 1.5, (Math.random() - 0.5) * 5);

        scene.add(sprite);
        objetos.push(sprite);

        ocultarEstado();
        promptInput.value = '';
      };

      img.onerror = () => {
        ocultarEstado();
        alert('No jaló la IA. Intenta otra vez, carnal.');
      };

      img.src = url;
    };

    // ===== BOTONES =====
    document.getElementById('btnCubo').onclick = crearCubo;
    document.getElementById('btnEsfera').onclick = crearEsfera;
    document.getElementById('btnBorrar').onclick = borrarUltimo;

    // ===== CÁMARA ORBITAL (1 dedo / mouse) =====
    let rotando = false, ultimoX = 0, ultimoY = 0;
    let anguloH = 0, anguloV = 0.4, distancia = 14;

    const canvas = renderer.domElement;

    // Touch
    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        rotando = true;
        ultimoX = e.touches[0].clientX;
        ultimoY = e.touches[0].clientY;
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
      if (!rotando || e.touches.length !== 1) return;
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - ultimoX;
      const dy = t.clientY - ultimoY;
      ultimoX = t.clientX;
      ultimoY = t.clientY;
      actualizarCamara(dx, dy);
    }, { passive: false });

    canvas.addEventListener('touchend', () => { rotando = false; });

    // Mouse
    canvas.addEventListener('mousedown', e => {
      rotando = true;
      ultimoX = e.clientX;
      ultimoY = e.clientY;
    });
    canvas.addEventListener('mousemove', e => {
      if (!rotando) return;
      const dx = e.clientX - ultimoX;
      const dy = e.clientY - ultimoY;
      ultimoX = e.clientX;
      ultimoY = e.clientY;
      actualizarCamara(dx, dy);
    });
    canvas.addEventListener('mouseup', () => { rotando = false; });
    canvas.addEventListener('mouseleave', () => { rotando = false; });

    function actualizarCamara(dx, dy) {
      anguloH -= dx * 0.008;
      anguloV -= dy * 0.008;
      anguloV = Math.max(0.1, Math.min(1.4, anguloV));

      const x = distancia * Math.cos(anguloV) * Math.sin(anguloH);
      const z = distancia * Math.cos(anguloV) * Math.cos(anguloH);
      const y = distancia * Math.sin(anguloV);
      camera.position.set(x, y, z);
      camera.lookAt(0, 1, 0);
    }

    // ===== LOOP =====
    function animar() {
      requestAnimationFrame(animar);
      renderer.render(scene, camera);
    }
    animar();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
